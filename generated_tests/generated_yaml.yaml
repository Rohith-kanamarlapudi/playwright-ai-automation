test_cases:
  - id: TC001
    title: Verify homepage loads with expected title
    priority: High
    steps:
      - Open https://ideabytes.com
    expected_result: Page title is 'Ideabytes'

  - id: TC002
    title: Click Contact link and verify navigation to contact page
    priority: High
    steps:
      - Open https://ideabytes.com
      - Click the 'Contact' link using selector a:has-text('Contact')
    expected_result: Current URL ends with '/contact-us.html'

  - id: TC003
    title: Click IoT Solutions link and verify external URL opens
    priority: Medium
    steps:
      - Open https://ideabytes.com
      - Click the 'IoT Solutions' link using selector a:has-text('IoT Solutions')
    expected_result: URL changes to 'https://www.ideabytesiot.com/'

  - id: TC004
    title: Click Test Automation link and verify navigation to test-automation page
    priority: High
    steps:
      - Open https://ideabytes.com
      - Click the 'Test Automation' link using selector a:has-text('Test Automation')
    expected_result: Current URL ends with '/test-automation.html'

  - id: TC005
    title: Click Teens4Tech link and verify navigation to Teens_tech page
    priority: High
    steps:
      - Open https://ideabytes.com
      - Click the 'Teens4Tech' link using selector a:has-text('Teens4Tech')
    expected_result: Current URL ends with '/Teens_tech.html'

  - id: TC006
    title: Fill Teens_tech registration form with valid data and submit
    priority: High
    steps:
      - Open https://ideabytes.com/Teens_tech.html
      - Fill the name input (name='widget-contact-form-name') with 'John Doe'
      - Fill the email input (name='widget-contact-form-email') with 'john@example.com'
      - Fill the age input (name='widget-contact-form-company') with '15'
      - Click the Register button using selector #form_submit1234
    expected_result: No HTML5 validation errors are displayed; form submits successfully

  - id: TC007
    title: Submit empty Teens_tech registration form and verify validation errors
    priority: High
    steps:
      - Open https://ideabytes.com/Teens_tech.html
      - Click the Register button using selector #form_submit1234
    expected_result: HTML5 validation messages appear for each required field (name, email, age)

  - id: TC008
    title: Fill only name field on Teens_tech form and verify email validation
    priority: High
    steps:
      - Open https://ideabytes.com/Teens_tech.html
      - Fill the name input (name='widget-contact-form-name') with 'John Doe'
      - Click the Register button using selector #form_submit1234
    expected_result: HTML5 validation message appears on the email field

  - id: TC009
    title: Verify name input placeholder on Teens_tech page
    priority: Medium
    steps:
      - Open https://ideabytes.com/Teens_tech.html
      - Check placeholder attribute of input[name='widget-contact-form-name']
    expected_result: Placeholder value is 'Enter your Name'

  - id: TC010
    title: Verify email input type attribute on Teens_tech page
    priority: Medium
    steps:
      - Open https://ideabytes.com/Teens_tech.html
      - Check type attribute of input[name='widget-contact-form-email']
    expected_result: Type attribute is 'email'

  - id: TC011
    title: Verify age input placeholder on Teens_tech page
    priority: Medium
    steps:
      - Open https://ideabytes.com/Teens_tech.html
      - Check placeholder attribute of input[name='widget-contact-form-company']
    expected_result: Placeholder value is 'Enter your Age'

  - id: TC012
    title: Verify PDF document loads successfully
    priority: Medium
    steps:
      - Open https://ideabytes.com/certificates/Ideabytes-ISO-IEC27017-2015.pdf
    expected_result: URL ends with '.pdf' and page loads without errors

  - id: TC013
    title: Verify LinkedIn link is present and clickable on homepage
    priority: Low
    steps:
      - Open https://ideabytes.com
      - Locate the LinkedIn link using selector a[href='https://in.linkedin.com/company/ideabytes-inc']
    expected_result: Link is visible and clickable

  - id: TC014
    title: Verify logo link is present and visible on homepage
    priority: Low
    steps:
      - Open https://ideabytes.com
      - Locate the logo link using selector a[href='https://ideabytes.com/index.html']
    expected_result: Link is visible

  - id: TC015
    title: Verify about-us page loads successfully
    priority: Medium
    steps:
      - Open https://ideabytes.com/about-us.html
    expected_result: Page loads with HTTP 200 and no errors

  - id: TC016
    title: Verify team page loads successfully
    priority: Medium
    steps:
      - Open https://ideabytes.com/team.html
    expected_result: Page loads with HTTP 200 and no errors

  - id: TC017
    title: Verify Register button is visible and enabled on Teens_tech page
    priority: Low
    steps:
      - Open https://ideabytes.com/Teens_tech.html
      - Locate the Register button using selector #form_submit1234
    expected_result: Button is visible and enabled

  - id: TC018
    title: Click Application Development link and verify navigation to web-mobile-app-dev page
    priority: High
    steps:
      - Open https://ideabytes.com
      - Click the 'Application Development' link using selector a:has-text('Application Development')
    expected_result: Current URL ends with '/web-mobile-app-dev.html'

  - id: TC019
    title: Click DG HAZMAT link and verify external URL opens
    priority: Medium
    steps:
      - Open https://ideabytes.com
      - Click the 'DG HAZMAT' link using selector a:has-text('DG HAZMAT')
    expected_result: URL changes to 'https://www.dgsms.ca'

  - id: TC020
    title: Click IGBMS link and verify external URL opens
    priority: Medium
    steps:
      - Open https://ideabytes.com
      - Click the 'IGBMS' link using selector a:has-text('IGBMS')
    expected_result: URL changes to 'https://igbms.com/'