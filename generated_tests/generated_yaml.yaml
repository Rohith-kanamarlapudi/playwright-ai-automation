test_cases:
  - id: TC001
    title: Verify no JavaScript error when clicking empty button on homepage
    priority: High
    steps:
      - Open homepage at https://ideabytes.com
      - Listen for console errors
      - Click button with selector "button:has-text('')"
    expected_result: No JavaScript console errors are recorded during the click

