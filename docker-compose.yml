version: "3.9"

services:

  api:
    build: .
    container_name: playwright-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./reports:/app/reports
      - ./generated_tests:/app/generated_tests
      - ./uploads:/app/uploads
      - ./db:/app/db

    restart: unless-stopped

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

  pipeline:
    build: .

    container_name: playwright-pipeline

    env_file:
      - .env

    volumes:
      - ./reports:/app/reports
      - ./generated_tests:/app/generated_tests
      - ./uploads:/app/uploads
      - ./db:/app/db

    command:
      [
        "python",
        "run_pipeline.py",
        "--url",
        "${TARGET_URL:-https://live.ideabytesiot.com/demolive}",
        "--max-pages",
        "${MAX_PAGES:-5}"
      ]

    profiles:
      - run