<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Test Case Generator</title>
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
 
    <style>
        :root {
            --bg-deep: #090d16;
            --bg-panel: #10151f;
            --bg-panel-raised: #161d2b;
            --border: #232c3f;
            --border-soft: #1b2230;
            --text-primary: #e7ecf6;
            --text-muted: #8791a8;
            --text-faint: #545f76;
            --accent-teal: #35e0c2;
            --accent-teal-dim: #1f4a44;
            --accent-amber: #f5b942;
            --accent-red: #ff6b6b;
            --accent-violet: #8f8bf7;
            --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
            --sans: 'Inter', -apple-system, 'Segoe UI', sans-serif;
        }
 
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        html, body {
            height: 100%;
        }
 
        body {
            font-family: var(--sans);
            background:
                radial-gradient(circle at 15% 10%, rgba(143, 139, 247, 0.10), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(53, 224, 194, 0.08), transparent 40%),
                var(--bg-deep);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }
 
        /* faint circuit-trace backdrop */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(53, 224, 194, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(53, 224, 194, 0.05) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(circle at 50% 30%, black, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at 50% 30%, black, transparent 70%);
            z-index: 0;
        }
 
        .container {
            width: 100%;
            max-width: 720px;
            position: relative;
            z-index: 1;
        }
 
        .hero {
            text-align: center;
            margin-bottom: 34px;
        }
 
        .hero .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-teal);
            background: rgba(53, 224, 194, 0.08);
            border: 1px solid rgba(53, 224, 194, 0.25);
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 22px;
        }
 
        .hero .eyebrow .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-teal);
            box-shadow: 0 0 8px var(--accent-teal);
        }
 
        .hero h1 {
            font-family: var(--mono);
            font-weight: 800;
            font-size: 38px;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
 
        .hero p {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.65;
            max-width: 540px;
            margin: 0 auto;
        }
 
        /* terminal window chrome around the card */
        .terminal {
            border-radius: 14px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(53, 224, 194, 0.04);
            overflow: hidden;
        }
 
        .terminal-titlebar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 13px 18px;
            background: var(--bg-panel-raised);
            border-bottom: 1px solid var(--border);
        }
 
        .terminal-titlebar .tl-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
 
        .tl-dot.red { background: #ff5f56; }
        .tl-dot.amber { background: #ffbd2e; }
        .tl-dot.green { background: #27c93f; }
 
        .terminal-titlebar .tl-label {
            margin-left: 10px;
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--text-faint);
            letter-spacing: 0.02em;
        }
 
        .upload-card {
            padding: 34px 38px 38px;
        }
 
        .form-group {
            margin-bottom: 26px;
        }
 
        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--mono);
            font-weight: 500;
            font-size: 13px;
            letter-spacing: 0.03em;
            margin-bottom: 10px;
            color: var(--text-muted);
        }
 
        .form-group label::before {
            content: "$";
            color: var(--accent-teal);
            font-weight: 700;
        }
 
        .form-group input[type="url"],
        .form-group input[type="file"] {
            width: 100%;
            padding: 13px 14px;
            background: #0c111c;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-size: 15px;
            font-family: var(--mono);
            color: var(--text-primary);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
 
        .form-group input[type="url"]::placeholder {
            color: var(--text-faint);
        }
 
        .form-group input[type="url"]:focus,
        .form-group input[type="file"]:focus {
            outline: none;
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px rgba(53, 224, 194, 0.15);
        }
 
        .form-group input[type="file"] {
            padding: 11px 14px;
            color: var(--text-muted);
        }
 
        .form-group input[type="file"]::file-selector-button {
            font-family: var(--sans);
            font-weight: 600;
            font-size: 13px;
            padding: 7px 14px;
            margin-right: 12px;
            border: none;
            border-radius: 6px;
            background: var(--accent-teal-dim);
            color: var(--accent-teal);
            cursor: pointer;
        }
 
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-teal), #22b8a2);
            color: #05231f;
            border: none;
            border-radius: 9px;
            font-family: var(--sans);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 24px rgba(53, 224, 194, 0.22);
        }
 
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(53, 224, 194, 0.32);
        }
 
        button:active {
            transform: scale(0.98);
        }
 
        .footnote {
            text-align: center;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-faint);
            margin-top: 22px;
            letter-spacing: 0.02em;
        }
 
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 28px;
            }
 
            .hero p {
                font-size: 15px;
            }
 
            .upload-card {
                padding: 26px 22px 30px;
            }
        }
    </style>
 
</head>
 
<body>
 
    <div class="container">
 
        <div class="hero">
            <span class="eyebrow"><span class="dot"></span>LangGraph multi-agent pipeline</span>
            <h1>🤖 AI Test Case Generator</h1>
 
            <p>
                Upload a Design Document (.txt, .md, .pdf) and automatically
                generate YAML Test Cases with Playwright Validation.
            </p>
        </div>
 
        <div class="terminal">
 
            <div class="terminal-titlebar">
                <span class="tl-dot red"></span>
                <span class="tl-dot amber"></span>
                <span class="tl-dot green"></span>
                <span class="tl-label">generator@ideabytes — /upload</span>
            </div>
 
            <div class="upload-card">
 
                <form action="/upload" method="POST" enctype="multipart/form-data">
 
                    <div class="form-group">
                        <label for="target_url">
                            Target Website URL
                        </label>
 
                        <input
                            type="url"
                            id="target_url"
                            name="target_url"
                            placeholder="https://live.ideabytesiot.com/demolive"
                            value="https://live.ideabytesiot.com/demolive"
                            required>
                    </div>
 
                    <div class="form-group">
                        <label for="file">
                            Upload Design Document
                        </label>
 
                        <input
                            type="file"
                            id="file"
                            name="file"
                            accept=".txt,.md,.pdf"
                            required>
                    </div>
 
                    <button type="submit">
                        🚀 Generate Test Cases
                    </button>
 
                </form>
 
            </div>
 
        </div>
 
        <p class="footnote">design doc in · YAML + Playwright tests out</p>
 
    </div>
 
</body>
 
</html>
